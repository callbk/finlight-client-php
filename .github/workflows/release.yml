name: Release check

# Packagist picks up a release from the git tag. This workflow only checks that the tag, the SDK
# version and the package content agree; it publishes nothing.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Tag equals FinlightClient::VERSION
        run: php scripts/check-version.php "${GITHUB_REF_NAME}"

      - name: Tests
        run: vendor/bin/phpunit

      - name: Package content (git archive)
        run: php scripts/check-package.php
