name: CI

on:
  push:
    branches: [main, v3]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} (${{ matrix.deps }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        deps: [highest]
        include:
          - php: '8.2'
            deps: lowest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.deps }}

      - name: Contract kit, case map, README, scope
        run: composer check

      - name: Tests (unit, conformance, examples)
        run: vendor/bin/phpunit

      - name: Static analysis
        if: matrix.php == '8.3' && matrix.deps == 'highest'
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  package:
    name: Package content and history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Package content (git archive)
        run: php scripts/check-package.php

      - name: No AI attribution in commit messages
        run: |
          if git log --format='%B' | grep -Eiq 'co-authored-by|generated (by|with)|claude|chatgpt|copilot'; then
            echo "commit messages must not carry AI attribution"; exit 1
          fi

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks GitHub Action needs a paid license for organization repositories; the CLI
      # does not. .gitleaks.toml allowlists the synthetic keys of the contract kit and the tests.
      - name: Secret scan
        env:
          GITLEAKS_VERSION: 8.21.2
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .
