name: CI

on:
  push:
    branches: [main, v3]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} (${{ matrix.deps }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        deps: [highest]
        include:
          - php: '8.2'
            deps: lowest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.deps }}

      - name: Contract kit, case map, README, scope
        run: composer check

      - name: Tests (unit, conformance, examples)
        run: vendor/bin/phpunit

      - name: Static analysis
        if: matrix.php == '8.3' && matrix.deps == 'highest'
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  package:
    name: Package content and history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Package content (git archive)
        run: php scripts/check-package.php

      - name: No AI attribution in commit messages
        run: |
          if git log --format='%B' | grep -Eiq 'co-authored-by|generated (by|with)|claude|chatgpt|copilot'; then
            echo "commit messages must not carry AI attribution"; exit 1
          fi

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
